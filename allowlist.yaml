# Exact HTTPS hostnames only. No wildcard domains or IP literals.
# Redirects and discovered oEmbed hosts must also be listed.
version: 1
embeds:
  # Video and music, including their common short links and preview endpoints.
  - youtube.com
  - www.youtube.com
  - m.youtube.com
  - youtu.be
  - i.ytimg.com
  - vimeo.com
  - www.vimeo.com
  - player.vimeo.com
  - i.vimeocdn.com
  - open.spotify.com
  - spotify.link
  - i.scdn.co
  - soundcloud.com
  - www.soundcloud.com
  - on.soundcloud.com
  - twitch.tv
  - www.twitch.tv
  - clips.twitch.tv
  # Code, discussions, images and reference pages.
  - github.com
  - www.github.com
  - gist.github.com
  - gitlab.com
  - www.gitlab.com
  - reddit.com
  - www.reddit.com
  - old.reddit.com
  - redd.it
  - i.redd.it
  - preview.redd.it
  - imgur.com
  - www.imgur.com
  - i.imgur.com
  - en.wikipedia.org
  - da.wikipedia.org
  - news.ycombinator.com
  - store.steampowered.com
  - steamcommunity.com

# These only permit configured, authorized outgoing webhook deliveries.
# Allowing a preview hostname above does not grant webhook access.
webhooks:
  - discord.com
  - hooks.slack.com

# Common browser Web Push providers. Add other exact subscription hosts as needed.
push:
  - fcm.googleapis.com
  - updates.push.services.mozilla.com
  - web.push.apple.com
