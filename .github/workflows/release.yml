name: Version release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ${#TAG} -gt 128 || ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Not a supported version tag: $TAG" >&2
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            IFS='.' read -ra identifiers <<< "${TAG#*-}"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^0[0-9]+$ ]]; then echo 'Invalid numeric prerelease identifier' >&2; exit 1; fi
            done
            echo 'prerelease=true' >> "$GITHUB_OUTPUT"
          else
            echo 'prerelease=false' >> "$GITHUB_OUTPUT"
          fi

  application:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Application and security tests, including tests/features
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          bunx vitest run --reporter=default --reporter=json --outputFile.json=reports/application.json 2>&1 | tee reports/application.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-results
          path: reports/
          if-no-files-found: warn

  irctest:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: bun install --frozen-lockfile
      - name: Prepare unchanged upstream revision
        run: |
          mkdir -p .compliance
          git clone https://github.com/progval/irctest.git .compliance/irctest
          git -C .compliance/irctest checkout --detach 7d5d761b7b67f9031daf7784e743d630def22a96
          test "$(git -C .compliance/irctest rev-parse HEAD)" = 7d5d761b7b67f9031daf7784e743d630def22a96
          python -m venv .compliance/venv
          .compliance/venv/bin/pip install -r .compliance/irctest/requirements.txt pytest-xdist pytest-timeout
      - name: Build once and run unchanged conformance selection
        shell: bash
        run: |
          set -o pipefail
          bun run build
          mkdir -p reports
          cd .compliance/irctest
          CFCORD_BUNDLE="$GITHUB_WORKSPACE/.output/server/index.mjs" CFCORD_SKIP_BUNDLE=1 PYTHONPATH="$GITHUB_WORKSPACE/compliance" "$GITHUB_WORKSPACE/.compliance/venv/bin/python" -m pytest --controller cfcord_controller -m '(Ergo or not implementation-specific) and not deprecated' -p no:cacheprovider --timeout=30 irctest/server_tests -n 8 -rA --junitxml="$GITHUB_WORKSPACE/reports/irctest.xml" 2>&1 | tee "$GITHUB_WORKSPACE/reports/irctest.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irctest-results
          path: reports/
          if-no-files-found: warn

  build-image:
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build once for linux/amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          tags: flarc:release-candidate
          outputs: type=docker,dest=${{ runner.temp }}/flarc-image.tar
      - name: Smoke the exact image without publishing
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/flarc-image.tar"
          docker volume create flarc-smoke-data
          docker run -d --name flarc-smoke --mount type=volume,source=flarc-smoke-data,target=/data -e SIGNUP_POLICY=open -p 127.0.0.1:18788:8788 flarc:release-candidate
          trap 'docker logs flarc-smoke || true; docker rm -f flarc-smoke || true; docker volume rm flarc-smoke-data || true' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18788/health >/dev/null; then break; fi
            if [[ "$i" == 60 ]]; then exit 1; fi
            sleep 1
          done
          docker exec -i flarc-smoke node --input-type=module < scripts/smoke-container.mjs
          docker stop --timeout 20 flarc-smoke
          docker run --rm --mount type=volume,source=flarc-smoke-data,target=/data,readonly flarc:release-candidate node --input-type=module -e 'import fs from "node:fs"; fs.cpSync("/data/do","/tmp/flarc-schema-copy",{recursive:true}); process.argv=["node","verify-schema","/tmp/flarc-schema-copy"]; await import("/app/.output/tools/verify-schema.mjs");'
          docker start flarc-smoke
          docker exec -i -e FLARC_SMOKE_PHASE=verify flarc-smoke node --input-type=module < scripts/smoke-container.mjs
          docker stop --timeout 20 flarc-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: flarc-image-amd64
          path: ${{ runner.temp }}/flarc-image.tar
          retention-days: 2
          compression-level: 0

  publish:
    needs: [validate-tag, application, irctest, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flarc-image-amd64
          path: ${{ runner.temp }}
      - name: Push the exact tested image and create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate-tag.outputs.prerelease }}
          IMAGE: ghcr.io/ircord/flarc
        shell: bash
        run: |
          set -euo pipefail
          docker load --input "$RUNNER_TEMP/flarc-image.tar"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag flarc:release-candidate "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          if [[ "$PRERELEASE" == false ]]; then
            docker tag flarc:release-candidate "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          release_flags=(--verify-tag --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then release_flags+=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${release_flags[@]}"
